<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Автосалон «Вектор»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#14202b; --muted:#5a6773; --line:#d5dbe1;
  --accent:#f2b705; --accent-ink:#14202b; --deep:#14202b; --deep-ink:#f3f5f7;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1820; --surface:#17232d; --ink:#eef2f5; --muted:#9aa8b4; --line:#2a3946;
    --deep:#0a1117; --deep-ink:#eef2f5; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#17232d; --ink:#eef2f5; --muted:#9aa8b4; --line:#2a3946;
  --deep:#0a1117; --deep-ink:#eef2f5; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;line-height:1.6;font-size:17px}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}

header.hero{background:var(--deep);color:var(--deep-ink);padding:72px 0 88px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:72px}
